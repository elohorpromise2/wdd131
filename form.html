<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WDD 131 Product Review Form">
    <meta name="author" content="Promise Elohor">
    <title>Product Review</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <label for="product">
                Product Name <span class="required">*</span>
            </label>

            <select id="product" name="product" required>
                <option value="" disabled selected>
                    Select a Product ...
                </option>
            </select>

            <fieldset>
                <legend>
                    Overall Rating <span class="required">*</span>
                </legend>

                <div class="rating">

                    <label for="rating1">
                        <span>☆</span>
                        <input
                            type="radio"
                            id="rating1"
                            name="rating"
                            value="1"
                            required
                        >
                    </label>

                    <label for="rating2">
                        <span>☆☆</span>
                        <input
                            type="radio"
                            id="rating2"
                            name="rating"
                            value="2"
                        >
                    </label>

                    <label for="rating3">
                        <span>☆☆☆</span>
                        <input
                            type="radio"
                            id="rating3"
                            name="rating"
                            value="3"
                        >
                    </label>

                    <label for="rating4">
                        <span>☆☆☆☆</span>
                        <input
                            type="radio"
                            id="rating4"
                            name="rating"
                            value="4"
                        >
                    </label>

                    <label for="rating5">
                        <span>☆☆☆☆☆</span>
                        <input
                            type="radio"
                            id="rating5"
                            name="rating"
                            value="5"
                        >
                    </label>

                </div>
            </fieldset>

            <label for="installDate">
                Date of Installation <span class="required">*</span>
            </label>

            <input
                type="date"
                id="installDate"
                name="installDate"
                required
            >

            <fieldset>

                <legend>
                    Which features did you find useful?
                    <em>(Check all that apply)</em>
                </legend>

                <label class="checkbox-label" for="durability">
                    <input
                        type="checkbox"
                        id="durability"
                        name="features"
                        value="Durability"
                    >
                    Durability
                </label>

                <label class="checkbox-label" for="ease">
                    <input
                        type="checkbox"
                        id="ease"
                        name="features"
                        value="Ease of Use"
                    >
                    Ease of Use
                </label>

                <label class="checkbox-label" for="performance">
                    <input
                        type="checkbox"
                        id="performance"
                        name="features"
                        value="Performance"
                    >
                    Performance
                </label>

                <label class="checkbox-label" for="design">
                    <input
                        type="checkbox"
                        id="design"
                        name="features"
                        value="Design"
                    >
                    Design
                </label>

            </fieldset>

            <label for="writtenReview">
                Written Review
                <span class="optional">(Optional)</span>
            </label>

            <textarea
                id="writtenReview"
                name="writtenReview"
                rows="7"
            ></textarea>

            <label for="userName">
                Your Name
                <span class="optional">(Optional)</span>
            </label>

            <input
                type="text"
                id="userName"
                name="userName"
            >

            <input
                type="submit"
                value="Post Review"
            >

        </form>
    </main>

    <footer>

        <p>
            &copy;
            <span id="currentyear"></span>
            🌸 Promise Elohor 🌸 Nigeria
        </p>

        <p>
            Last Modification:
            <span id="lastModified"></span>
        </p>

    </footer>

</body>
</html>
