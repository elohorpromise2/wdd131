<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WDD 131 Product Review Form for submitting and tracking reviews of products, ratings, installation dates, and useful features.">
    <meta name="author" content="Promise Elohor">
    <title>Product Review</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <!-- Product Name -->
            <label for="product">
                Product Name <span class="required">*</span>
            </label>

            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>


            <!-- Overall Rating -->
            <fieldset>
                <legend>
                    Overall Rating <span class="required">*</span>
                </legend>

                <div class="rating">

                    <label for="rating1">
                        <input type="radio" id="rating1" name="rating" value="1" required>
                        <span>★</span>
                    </label>

                    <label for="rating2">
                        <input type="radio" id="rating2" name="rating" value="2" required>
                        <span>★★</span>
                    </label>

                    <label for="rating3">
                        <input type="radio" id="rating3" name="rating" value="3" required>
                        <span>★★★</span>
                    </label>

                    <label for="rating4">
                        <input type="radio" id="rating4" name="rating" value="4" required>
                        <span>★★★★</span>
                    </label>

                    <label for="rating5">
                        <input type="radio" id="rating5" name="rating" value="5" required>
                        <span>★★★★★</span>
                    </label>

                </div>
            </fieldset>


            <!-- Date of Installation -->
            <label for="installDate">
                Date of Installation <span class="required">*</span>
            </label>

            <input
                type="date"
                id="installDate"
                name="installDate"
                required
            >


            <!-- Useful Features -->
            <fieldset>
                <legend>Useful Features</legend>

                <label class="checkbox-label" for="durability">
                    <input
                        type="checkbox"
                        id="durability"
                        name="features"
                        value="Durability"
                    >
                    Durability
                </label>

                <label class="checkbox-label" for="ease">
                    <input
                        type="checkbox"
                        id="ease"
                        name="features"
                        value="Ease of Use"
                    >
                    Ease of Use
                </label>

                <label class="checkbox-label" for="performance">
                    <input
                        type="checkbox"
                        id="performance"
                        name="features"
                        value="Performance"
                    >
                    Performance
                </label>

                <label class="checkbox-label" for="design">
                    <input
                        type="checkbox"
                        id="design"
                        name="features"
                        value="Design"
                    >
                    Design
                </label>

            </fieldset>


            <!-- Written Review -->
            <label for="writtenReview">
                Written Review
                <span class="optional">(Optional)</span>
            </label>

            <textarea
                id="writtenReview"
                name="writtenReview"
            ></textarea>


            <!-- User Name -->
            <label for="userName">
                User Name
                <span class="optional">(Optional)</span>
            </label>

            <input
                type="text"
                id="userName"
                name="userName"
            >


            <!-- Submit -->
            <input type="submit" value="Post Review">

        </form>
    </main>


    <footer>
        <p>
            © <span id="currentyear"></span> 🌸 Promise Elohor 🌸 Nigeria
        </p>

        <p>
            Last Modification:
            <span id="lastModified"></span>
        </p>
    </footer>

</body>
</html>
